[package]
name = "rust_vllm_terminal"
version = "0.1.0"
edition = "2024"
authors = ["CeeArEx"]

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.42", features = ["derive"] }
dialoguer = "0.11.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.31"
half = { version = "2.6.0", features = ["serde"] }
reqwest = { version = "0.12.22", features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
termimad = "0.33.0"
tokio = { version = "1.47.0", features = ["full"] }
toml = "0.9.4"

[package.metadata.deb]
maintainer = "CeeArEx"
copyright = "2025, Christian Rute"
license-file = ["LICENSE", "0"]
extended-description = """\
Ein CLI-Tool zur Interaktion mit einem lokalen vLLM-Server.
Ermöglicht Single-Shot-Prompts und persistente Chat-Sitzungen."""
assets = [
    ["target/release/rust_vllm_terminal", "/usr/bin/rust_vllm_terminal", "755"], 
]
