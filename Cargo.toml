[package]
name = "rust_vllm_terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
termimad = "0.33.0"
tokio = { version = "1.47.0", features = ["full"] }
toml = "0.9.4"
