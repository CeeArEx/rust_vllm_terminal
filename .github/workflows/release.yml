name: Create Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: rust_vllm_terminal

jobs:
  # JOB 1: Linux 
  build-linux:
    name: Build Linux (Debian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb
      - run: cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: target/debian/*.deb

  # JOB 2: Windows
  build-windows:
    name: Build Windows (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build for Windows
        run: cargo build --release
      - name: Package in ZIP file
        run: Compress-Archive -Path target/release/${{ env.PROJECT_NAME }}.exe -DestinationPath ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip
      - name: Upload Windows ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ./${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip

  publish-release:
    name: Publish Release on GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/debian-package/*.deb
            artifacts/windows-package/*.zip
            