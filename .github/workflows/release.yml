name: Create Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (Debian)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        run: cargo deb

      - name: Upload Debian package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package 
          path: target/debian/*.deb 

  build-windows:
    name: Build Windows (MSI)
    runs-on: windows-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build for Windows
        run: cargo build --release

      - name: Package in ZIP file
        run: Compress-Archive -Path target/release/${{ env.PROJECT_NAME }}.exe -DestinationPath ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip
      
      - name: Upload Windows ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package 
          path: ./${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip


  publish-release:
    name: Publish Release on GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts 

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:

          files: |
            artifacts/debian-package/*.deb
            artifacts/windows-package/*.zip